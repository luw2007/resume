[package]
name = "resume"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
description = "Read-only terminal launcher that discovers and resumes local coding-agent sessions."
repository = "https://github.com/luw2007/resume"
readme = "README.md"
authors = ["resume contributors"]
license = "MIT"

[[example]]
name = "resume-spike"
path = "examples/resume-spike.rs"

[[bench]]
name = "discovery"
harness = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skim = "0.17"
thiserror = "2"
toml = "0.9"
unicode-width = "0.2"

# Optional Codex `state_5.sqlite` enrichment (Step 8). Gated so the entire
# SQLite read path can be compiled out; never required for Codex discovery.
# `bundled` statically links a bundled SQLite so there is no system libsqlite3
# dependency and no risk of opening via a host-provided shared object.
# Pinned to 0.37 because the bundled libsqlite3-sys >= 0.35 build script uses
# the unstable `cfg_select!` macro and cannot compile on stable Rust.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[features]
# Default features keep SQLite consumers off so a plain `cargo build` never
# links SQLite. Enable with `--features codex-sqlite` or `--features opencode`.
default = []
codex-sqlite = ["dep:rusqlite"]
# OpenCode persists sessions only in a SQLite database (no JSONL/plain-file
# fallback exists), so this feature is required for `-a opencode` discovery
# to do anything; without it the integration degrades to a single diagnostic
# and returns no Sessions, matching every other integration's "read-only,
# never-blocks-the-others" contract.
opencode = ["dep:rusqlite"]

# skim-tuikit 0.6.6 omits xterm's `CSI 1;3{C,D}` Alt-arrow mappings. The
# picker uses those keys for tab navigation; retain the upstream API and patch
# only the parser until the dependency ships the mapping.
[patch.crates-io]
skim-tuikit = { path = "vendor/skim-tuikit" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
portable-pty = "0.9"
proptest = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
