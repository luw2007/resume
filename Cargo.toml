[package]
name = "resume"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[[example]]
name = "resume-spike"
path = "examples/resume-spike.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skim = "0.17"
thiserror = "2"
toml = "0.9"
unicode-width = "0.2"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
