name: Release Builds

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  target-builds:
    name: Target ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            command: cargo build --release --locked --all-features --target aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
            command: cargo build --release --locked --all-features --target x86_64-apple-darwin
          # `rusqlite` uses bundled libsqlite3-sys, which invokes a C compiler.
          # cargo-zigbuild supplies the audited cross C toolchain and musl libc;
          # keeping `bundled` means no host SQLite or OpenSSL is linked.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            command: cargo zigbuild --release --locked --all-features --target aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            command: cargo zigbuild --release --locked --all-features --target x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        uses: goto-bus-stop/setup-zig@v2
      - if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --locked
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: resume-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/resume
          if-no-files-found: error
