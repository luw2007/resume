name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Isolate agent and XDG roots
        shell: bash
        run: |
          root="$RUNNER_TEMP/resume-ci-home"
          mkdir -p "$root"/{home,xdg-config,xdg-data,xdg-state,xdg-cache,pi,omp,claude,codex,bin}
          {
            # Pin rustup/cargo to their real install roots *before*
            # redirecting HOME below. Both default to `$HOME/.rustup` and
            # `$HOME/.cargo`; once HOME points at the isolated fixture
            # directory, an unpinned rustup can no longer find the toolchain
            # `dtolnay/rust-toolchain` just installed and every `cargo`
            # invocation fails with "could not choose a version of cargo to
            # run, because ... no default is configured".
            echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}"
            echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
            echo "HOME=$root/home"
            echo "XDG_CONFIG_HOME=$root/xdg-config"
            echo "XDG_DATA_HOME=$root/xdg-data"
            echo "XDG_STATE_HOME=$root/xdg-state"
            echo "XDG_CACHE_HOME=$root/xdg-cache"
            echo "PI_CODING_AGENT_DIR=$root/pi"
            echo "PI_CODING_AGENT_SESSION_DIR=$root/pi/sessions"
            echo "PI_CONFIG_DIR=$root/omp"
            echo "CLAUDE_CONFIG_DIR=$root/claude"
            echo "CODEX_HOME=$root/codex"
          } >> "$GITHUB_ENV"
          for agent in pi claude codex omp; do
            printf '#!/bin/sh\nexit 0\n' > "$root/bin/$agent"
            chmod +x "$root/bin/$agent"
          done
          echo "$root/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - name: Rustdoc warnings are errors
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features --locked

  msrv:
    name: Rust 1.91 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - run: cargo build --all-features --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans advisories sources
